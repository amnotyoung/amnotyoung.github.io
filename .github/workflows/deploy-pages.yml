name: Deploy learning archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh public view counts on schedule
        if: github.event_name == 'schedule'
        run: node scripts/build-view-counts.mjs

      - name: Refresh public view counts for content deployment
        if: github.event_name != 'schedule'
        run: node scripts/build-view-counts.mjs --allow-stale

      - name: Build homepage catalog
        run: node scripts/build-home.mjs

      - name: Validate site
        run: |
          node scripts/build-home.mjs --check
          node scripts/validate-columns.mjs
          node scripts/validate-view-counts.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
